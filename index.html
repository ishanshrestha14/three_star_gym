<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1b1d" />

    <!--
      Static defaults. Link previews (WhatsApp, Facebook) don't run JavaScript,
      so these are what every shared link shows. Keep the name and description in
      sync with Admin → Settings. %VITE_SITE_URL% is filled in at build time.
    -->
    <title>Three Star Gym — Gym in Kathmandu</title>
    <meta name="description" content="Strength training, personal coaching and group classes in Kathmandu. Book a free trial session." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Three Star Gym" />
    <meta property="og:title" content="Three Star Gym — Gym in Kathmandu" />
    <meta property="og:description" content="Strength training, personal coaching and group classes in Kathmandu. Book a free trial session." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
